<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #20211d; }
  .wrap { padding: 16px; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  p.sub { font-size: 11.5px; color: #8a897f; margin: 0 0 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid #ede9de; }
  .row:first-of-type { border-top: none; }
  .row .label { font-size: 13px; }
  .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track { position: absolute; inset: 0; background: #d8d3c6; border-radius: 22px; transition: background .15s; cursor: pointer; }
  .track::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: transform .15s; }
  input:checked + .track { background: #0f5c56; }
  input:checked + .track::before { transform: translateX(16px); }
  .status { font-size: 11px; margin-top: 2px; color: #8a897f; }
  a.dashboard-link { display: block; text-align: center; margin-top: 14px; padding: 8px; border-radius: 8px; background: #0f5c56; color: white; text-decoration: none; font-size: 12.5px; font-weight: 600; }
  a.dashboard-link:hover { background: #0c4a45; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DiSCaScribe capture</h1>
  <p class="sub">Only runs on discascribe.vercel.app/consultations/&hellip;</p>
  <div class="row">
    <div>
      <div class="label">Enabled</div>
      <div class="status" id="status">checking&hellip;</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled-toggle">
      <span class="track"></span>
    </label>
  </div>
  <a class="dashboard-link" href="http://localhost:5000/dashboard" target="_blank" rel="noopener">Open dashboard</a>
</div>
<script src="popup.js"></script>
</body>
</html>
